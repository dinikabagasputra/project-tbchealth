<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Buat Akun</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login">

<h2>Buat Akun</h2>

<form onsubmit="register(event)">

    <div class="input-box">
        <label>👤 Username</label>
        <input type="text"
               id="username"
               placeholder="Masukkan Username"
               required>
    </div>

    <div class="input-box">
        <label>🔒 Password</label>
        <input type="password"
               id="password"
               placeholder="Masukkan Password"
               required>
    </div>

    <button type="submit">
        Daftar
    </button>

</form>

<p>
    Sudah punya akun?
    <a href="login.html">Login</a>
</p>

</div>

<script src="register.js"></script>

</body>
</html>
